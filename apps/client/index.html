<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Frontline</title>
    <!-- Fonts are self-hosted (see public/fonts/README.md) and declared in src/fonts.css. The
         interface face is preloaded because layout is measured against it. Roboto Condensed is
         one variable file per subset, so this single request covers all four weights; only the
         latin subset is preloaded, since latin-ext is reached by accented input the UI does not
         produce on its own. -->
    <link
      rel="preload"
      href="/fonts/roboto-condensed-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
